services:
  rdrs-monitor:
    build: .
    container_name: rdrs-monitor
    command: python -m app.main
    environment:
      - RDRS_DOCKER=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  rdrs-api:
    build: .
    container_name: rdrs-api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - rdrs-monitor
    restart: unless-stopped