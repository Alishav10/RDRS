app:
  name: "Ransomware Detection and Response System"
  version: "1.0.0"

monitoring:
  watch_folders:
    - "data/sandbox"

  entropy:
    sample_size: 65536
    suspicious_threshold: 7.0

  file_activity:
    suspicious_extension_threshold: 3
    rapid_change_threshold: 10
    rename_threshold: 3
    time_window_seconds: 5
    detection_window_seconds: 60

logging:
  directory: "logs"
  rotation: "10 MB"
  retention: "7 days"
  level: "INFO"

database:
  path: "data/rdrs.db"

threat_scoring:
  weights:
    rapid_encryption: 40
    mass_rename: 30
    high_entropy: 25
    cpu_spike: 15
    unknown_program: 10

  levels:
    normal_max: 40
    warning_max: 70

response:
  simulation_mode: true
  quarantine_directory: "data/quarantine"